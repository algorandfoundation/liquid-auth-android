name: Liquid Auth - Android - Release

on:
  push:
    # TODO: rename trunk to main
    branches: [ 'release/*', 'develop' ]
jobs:
  build:
    permissions:
      issues: write
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT_SK }}
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - uses: actions/checkout@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build with Gradle
        run: ./gradlew build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --save @semantic-release/changelog @semantic-release/git @semantic-release/github
      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Merge Release -> Main
        uses: devmasx/merge-branch@854d3ac71ed1e9deb668e0074781b81fdd6e771f
        if: github.ref == 'refs/heads/release/1.x'
        with:
          type: now
          from_branch: release/1.x
          # TODO rename trunk to main
          target_branch: develop
          github_token: ${{ steps.app-token.outputs.token }}
